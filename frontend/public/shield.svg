<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldBg" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Cyber Blue Rim -->
    <linearGradient id="rimGlow" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Gold Police Star Gradient -->
    <linearGradient id="goldStar" x1="32" y1="16" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Inner Core Gradient -->
    <radialGradient id="coreGlow" cx="32" cy="30" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Drop Shadow -->
  <path d="M32 3 L54 11 C54 28 47 48 32 60 C17 48 10 28 10 11 Z" fill="#000000" opacity="0.4" transform="translate(0, 2)"/>

  <!-- Main Shield Body -->
  <path d="M32 3 L54 11 C54 28 47 48 32 60 C17 48 10 28 10 11 Z" fill="url(#shieldBg)" stroke="url(#rimGlow)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner Inset Shield -->
  <path d="M32 7 L49 14 C49 28 43 44 32 54 C21 44 15 28 15 14 Z" fill="none" stroke="#1e3a8a" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Radar/AI Ambient Glow -->
  <circle cx="32" cy="30" r="16" fill="url(#coreGlow)"/>

  <!-- Grid Reticle lines for AI Cyber aesthetic -->
  <path d="M32 16 L32 44 M18 30 L46 30" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="2 2"/>
  <circle cx="32" cy="30" r="11" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Police 8-Pointed Star of Intelligence -->
  <path d="M32 17 L34.5 25.5 L43 23 L37.5 29.5 L44 34 L35.5 34.5 L34 43 L30 36 L24 41 L27 33.5 L20 31 L27.5 27.5 L23 20 L30 24.5 Z" fill="url(#goldStar)"/>

  <!-- Central Emblem Eye / Star Core -->
  <circle cx="32" cy="30" r="4.5" fill="#0f172a" stroke="#fde047" stroke-width="1.2"/>
  <circle cx="32" cy="30" r="2" fill="#38bdf8"/>

  <!-- Top Indian Tricolor Inspired Subtle Accents -->
  <path d="M22 9 L42 9" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M25 12 L39 12" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M28 15 L36 15" stroke="#22c55e" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
</svg>
